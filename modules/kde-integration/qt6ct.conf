; Hito 004 follow-up 20 — este archivo no existía en absoluto. home.nix
; setea QT_QPA_PLATFORMTHEME=qt6ct pero sin este config qt6ct no tiene
; NADA declarado — Qt cae a sus defaults compilados (icon theme genérico,
; sin estilo explícito), lo que probablemente contribuía al look
; "Breeze-dark default" reportado en el sidebar de Dolphin en su momento.
;
; A diferencia de kdeglobals (KConfig, comentarios con "#"), qt6ct usa el
; formato QSettings/INI estándar de Qt, que SÍ acepta ";" — no es el mismo
; error que se corrigió en kdeglobals (follow-up 19), son dos parsers
; distintos con convenciones distintas.
;
; Hito 005 §6/§12 (migración final: Dolphin -> nixfm) — "style=kvantum"
; se quitó: Kvantum (el QStyle plugin) se retiró del todo esta ronda,
; ningún app QWidget queda en el sistema para leerlo. icon_theme SÍ se
; queda — CONFIRMADO como dependencia real de nixfm (no solo de Dolphin):
; es lo que resuelve los íconos de su toolbar, investigado en vivo en
; una ronda anterior (ver docs/NIXOS_ARCHITECTURE_HITO_005.md §12).
[Appearance]
icon_theme=Papirus-Dark
color_scheme_path=
custom_palette=false

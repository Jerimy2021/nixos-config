; Hito 004 follow-up 20 — este archivo no existía en absoluto. home.nix
; setea QT_QPA_PLATFORMTHEME=qt6ct (necesario para que QT_STYLE_OVERRIDE=
; kvantum aplique de verdad, ver home.nix) pero sin este config qt6ct no
; tiene NADA declarado — Qt cae a sus defaults compilados (icon theme
; genérico, sin estilo explícito), lo que probablemente contribuía al
; look "Breeze-dark default" reportado en el sidebar de Dolphin.
;
; A diferencia de kdeglobals (KConfig, comentarios con "#"), qt6ct usa el
; formato QSettings/INI estándar de Qt, que SÍ acepta ";" — no es el mismo
; error que se corrigió en kdeglobals (follow-up 19), son dos parsers
; distintos con convenciones distintas.
[Appearance]
style=kvantum
icon_theme=Papirus-Dark
color_scheme_path=
custom_palette=false
